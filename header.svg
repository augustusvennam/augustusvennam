<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
text{font-family:SFMono-Regular,Consolas,Menlo,'Courier New',monospace}
.cur{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
.t{animation:r 2.4s steps(16) .4s both}@keyframes r{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.s{animation:sc 6s linear infinite}@keyframes sc{from{transform:translateY(-20px)}to{transform:translateY(420px)}}
.f{animation:f 1.2s ease 2.6s both}@keyframes f{from{opacity:0}to{opacity:1}}
</style>
<defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1a1a1a" stroke-width="1"/></pattern>
<linearGradient id="l" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#5EEAD4" stop-opacity="0"/><stop offset=".5" stop-color="#5EEAD4" stop-opacity=".12"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></linearGradient></defs>
<rect width="1200" height="400" fill="#0d0d0d"/><rect width="1200" height="400" fill="url(#g)"/>
<rect class="s" width="1200" height="20" fill="url(#l)"/>
<rect x="40" y="40" width="1120" height="320" rx="10" fill="none" stroke="#262626"/>
<circle cx="68" cy="68" r="6" fill="#333"/><circle cx="90" cy="68" r="6" fill="#333"/><circle cx="112" cy="68" r="6" fill="#5EEAD4"/>
<text x="80" y="150" font-size="22" fill="#6b7280">$ whoami</text>
<g class="t"><text x="80" y="235" font-size="76" font-weight="700" fill="#f5f5f5">Augustus Vennam</text></g>
<g class="f"><text x="80" y="285" font-size="22" fill="#5EEAD4">CS + UX  //  Software · Robotics · AI-assisted dev</text>
<text x="80" y="325" font-size="16" fill="#6b7280">BSc Computer Science · Minor in UX · Wilfrid Laurier University</text></g>
<rect class="cur" x="1090" y="190" width="18" height="46" fill="#5EEAD4"/>
</svg>